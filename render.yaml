# Render Blueprint: main 브랜치에 푸시하면 정적 사이트를 자동으로 다시 빌드·배포한다.
services:
  - type: web
    name: rollent
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
